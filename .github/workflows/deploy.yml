# A staging copy of the lab site's "wvu" branch AND the DSPIRA lessons site's
# "wvu" branch, served together at
#   https://wvurail.org/rail-preview/                 (lab site)
#   https://wvurail.org/rail-preview/dspira-lessons/  (lessons site)
# — the same shape they will have at rail.wvu.edu. The custom domain is
# inherited from the organisation site, so this project repo publishes under a
# subpath of it automatically. Nothing here is the real site: it exists so the
# Design System builds can be reviewed (Conceptboard, the SCM review) before
# they replace main in each repo.
#
# Every page is built with noindex, and the lab repo's CNAME file is removed
# from the output before upload — a CNAME in a deployed project site would
# tell GitHub to claim that domain for THIS repo and collide with the
# organisation site.
#
# Pages itself is switched on once, by hand: Settings -> Pages -> Source:
# "GitHub Actions". The workflow token is not allowed to do that.
#
# Teardown, at cutover: delete this repo, or switch Pages off.

name: Stage the wvu branches

on:
  schedule:
    - cron: "*/30 * * * *"   # picks up pushes to either repo within half an hour
  workflow_dispatch:         # or immediately, by hand (Actions -> Run workflow)
  push:
    branches: [main]         # edits to this workflow itself

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Lab site (wvurail.github.io @ wvu)
        uses: actions/checkout@v5
        with:
          repository: WVURAIL/wvurail.github.io
          ref: wvu
          path: lab

      - name: Lessons site (dspira-lessons @ wvu)
        uses: actions/checkout@v5
        with:
          repository: WVURAIL/dspira-lessons
          ref: wvu
          path: lessons

      # The same gems GitHub Pages runs (Jekyll 3.9 via the github-pages
      # metagem), pinned exactly as the lab repo's own build workflow pins
      # them. One bundle serves both builds.
      - name: Pin the exact gems GitHub Pages uses
        run: |
          cat > Gemfile.ci <<'GEMFILE'
          source "https://rubygems.org"
          gem "github-pages", group: :jekyll_plugins
          gem "webrick", "~> 1.8"
          GEMFILE

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile.ci

      # Overrides only: the subpath each site lives at, noindex on every page
      # (both layouts honour site.noindex_all), and — for the lessons site —
      # where the lab site is, since it links back to it. url stays
      # https://wvurail.org so canonical / og:url / sitemap are at least
      # truthful about the host they are served from.
      - name: Staging overrides
        run: |
          {
            echo "baseurl: /rail-preview"
            echo "noindex_all: true"
          } > lab-staging.yml
          {
            echo "baseurl: /rail-preview/dspira-lessons"
            echo "noindex_all: true"
            echo "lab_url: /rail-preview"
          } > lessons-staging.yml

      - name: Build the lab site
        working-directory: lab
        run: bundle exec jekyll build --trace --config _config.yml,../lab-staging.yml -d ../_site
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile.ci
          JEKYLL_ENV: production

      - name: Build the lessons site into its subpath
        working-directory: lessons
        run: bundle exec jekyll build --trace --config _config.yml,../lessons-staging.yml -d ../_site/dspira-lessons
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile.ci
          JEKYLL_ENV: production

      # The lab site links to the lessons site root-absolutely
      # (/dspira-lessons/...) because in production the two share a host root.
      # Under the preview they share /rail-preview/ instead, so those links are
      # rewritten in the lab build. The lessons site needs no rewrite: its links
      # back to the lab go through its lab_url setting, which the override above
      # points at the preview.
      - name: Keep cross-site links inside the preview
        run: |
          find _site -maxdepth 3 -name '*.html' -not -path '_site/dspira-lessons/*' -print0 > /tmp/lab-pages
          xargs -0 -a /tmp/lab-pages sed -i -e 's|href="/dspira-lessons/|href="/rail-preview/dspira-lessons/|g' -e 's|url=/dspira-lessons/|url=/rail-preview/dspira-lessons/|g'

      - name: Sanity-check the preview before publishing it
        run: |
          rm -f _site/CNAME _site/dspira-lessons/CNAME
          test ! -e _site/CNAME
          grep -q 'name="robots" content="noindex"' _site/index.html
          grep -q 'name="robots" content="noindex"' _site/dspira-lessons/index.html
          grep -q 'href="/rail-preview/dspira-lessons/' _site/index.html
          grep -q 'href="/rail-preview/"' _site/dspira-lessons/index.html
          ! grep -rq 'giscus' _site/dspira-lessons

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
